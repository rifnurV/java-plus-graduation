spring:
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: "stats.aggregator.consumer"
      client-id: "stats.aggregator"
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: ru.practicum.stats.kafka.deserializer.ActionTypeDeserializer
    producer:
      client-id: "stats.aggregator"
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: ru.practicum.stats.kafka.serializer.GeneralAvroSerializer

# Маппинг логических имен топиков на реальные имена в Kafka
collector:
  kafka:
    consumer:
      topics:
        user-actions: "stats.user-actions.v1"
    producer:
      topics:
        eventsTopic: "stats.events-similarity.v1"