server:
  port: 0
  servlet:
    encoding:
      force: true
      charset: UTF-8

spring:
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss  # Глобальный формат даты для java.util.Date
    serialization:
      write-dates-as-timestamps: false  # Отправляем даты в читаемом виде, а не как таймстемпы
    default-property-inclusion: non_null

  jpa:
    hibernate.ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        connection:
          read_only: false

  sql.init.mode: always

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:6541/users_db
    username: root
    password: root

logging:
  level:
    org:
      springframework:
        web: INFO
        http:
          converter: INFO
        orm:
          jpa: INFO
          jpa.JpaTransactionManager: INFO
        transaction:
          TransactionInterceptor: INFO