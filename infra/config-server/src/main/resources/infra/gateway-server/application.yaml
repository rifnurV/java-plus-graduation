server:
  port: 8080

spring:
  application:
    name: gateway-server
  output:
    ansi:
      enabled: always
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: request-service
          uri: lb://request-service
          predicates:
            - Path=/users/{userId}/requests/**, /users/{userId}/events/{eventId}/requests, /client/request/**

        - id: user-service
          uri: lb://user-service
          predicates:
           - Path=/admin/users/**, client/users/**

        - id: category-service
          uri: lb://category-service
          predicates:
            - Path=/admin/categories/**, /categories/**, /client/categories/**

        - id: event-service
          uri: lb://event-service
          predicates:
            - Path=/admin/compilations/**, /admin/**, /client/**, /compilations/**, /categories/**, /events/**, /users/**

        - id: stats-server
          uri: lb://stats-server
          predicates:
            - Path=/hit/**, /stats/**

logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.http.server.reactive: INFO
    reactor.netty: INFO

management:
  endpoints:
    web:
      exposure:
        include: info
  info:
    env:
      enabled: true
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/